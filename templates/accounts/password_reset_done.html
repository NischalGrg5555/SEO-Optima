{% extends "layouts/auth_split.html" %}
{% block title %}Check Your Email | SEO Optima{% endblock %}

{% block content %}
  <h2 class="auth-title mb-2">Check your inbox</h2>
  <p class="auth-subtle mb-4">
    If an account exists for that email, we sent a password reset link.
    Please check your inbox and spam folder.
  </p>

  <div class="d-grid gap-2">
    <a href="{% url 'accounts:login' %}" class="btn btn-brand py-2">Back to Sign In</a>
  </div>
{% endblock %}
